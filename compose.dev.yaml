# Local development over compose.yaml: the same services, built from this checkout. `just up` and
# `just db-up` add it; deploy/cubebot then uses the local sandbox images `just up` builds.
name: cubebot-dev
services:
  # A checkout's tools reach the database directly; a release keeps it on Compose's network.
  postgres:
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

  orchestrator:
    image: cubebot-orchestrator:local
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile

  web:
    image: cubebot-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
