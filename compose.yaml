# One Cubebot installation from the release images (ghcr.io, CUBEBOT_VERSION). deploy/cubebot runs it,
# adding compose.domain.yaml, compose.agents.yaml and compose.control.yaml as .env asks; in a checkout
# `just up` adds compose.dev.yaml, which builds the same services from source.
name: cubebot
services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: cubebot
      POSTGRES_USER: cubebot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cubebot -d cubebot']
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  credential-key:
    image: postgres:18-bookworm
    user: '0:0'
    # The orchestrator's key for stored provider credentials, made once and kept in its volume.
    command:
      - sh
      - -euc
      - umask 077; [ -s /state/credential.key ] || head -c 32 /dev/urandom > /state/credential.key; chown 65532:65532 /state/credential.key
    volumes:
      - orchestrator-state:/state
    network_mode: none

  orchestrator:
    # The `local` default only ever applies under compose.dev.yaml, which replaces the image.
    image: ${CUBEBOT_REGISTRY:-ghcr.io/vicotrbb}/cubebot-orchestrator:${CUBEBOT_VERSION:-local}
    environment:
      CUBEBOT_DATABASE_URL: postgres://cubebot:${POSTGRES_PASSWORD}@postgres:5432/cubebot
      CUBEBOT_BIND_ADDR: 0.0.0.0:8080
      CUBEBOT_CREDENTIAL_KEY_FILE: /state/credential.key
      CUBEBOT_PUBLIC_ORIGIN: http://localhost:${CUBEBOT_PORT:-3000}
      CUBEBOT_STORAGE_DIRECTORY: /var/lib/cubebot/files
      CUBEBOT_INSTALLATION_NAME: ${CUBEBOT_INSTALLATION_NAME:-Cubebot}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - orchestrator-state:/state:ro
      # Shared files (ADR 0059): only this one orchestrator mounts it.
      - shared-files:/var/lib/cubebot/files
    depends_on:
      postgres:
        condition: service_healthy
      credential-key:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  web:
    image: ${CUBEBOT_REGISTRY:-ghcr.io/vicotrbb}/cubebot-web:${CUBEBOT_VERSION:-local}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  proxy:
    image: caddy:2.10.2-alpine
    ports:
      - '127.0.0.1:${CUBEBOT_PORT:-3000}:3000'
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
    depends_on:
      - orchestrator
      - web
    restart: unless-stopped

configs:
  # The console and its API on one origin, as an ingress serves them: /api to the orchestrator,
  # everything else to the web server. With CUBEBOT_DOMAIN, Caddy obtains a public certificate for it.
  caddyfile:
    content: |
      ${CUBEBOT_DOMAIN:-http://:3000} {
      	reverse_proxy /api/* orchestrator:8080
      	reverse_proxy web:3000
      }

volumes:
  postgres-data:
  orchestrator-state:
  shared-files:
  caddy-data:
