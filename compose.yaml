# One installation from the release images; deploy/cubebot runs it and adds the overlays .env asks for.
name: cubebot
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  postgres:
    image: postgres:18-bookworm
    # An init reaps health checks docker kills; as PID 1 the postmaster would restart every connection.
    init: true
    environment:
      POSTGRES_DB: cubebot
      POSTGRES_USER: cubebot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cubebot -d cubebot']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true

  credential-key:
    image: postgres:18-bookworm
    user: '0:0'
    # The orchestrator's key for stored provider credentials, made once and kept in its volume, or
    # for a restore the backed-up installation's key from CUBEBOT_RESTORE_KEY. Bucket secrets from
    # .env become files, so the orchestrator never reads a secret from its environment.
    environment:
      CUBEBOT_RESTORE_KEY: ${CUBEBOT_RESTORE_KEY:-}
      CUBEBOT_BACKUP_SECRET_ACCESS_KEY: ${CUBEBOT_BACKUP_SECRET_ACCESS_KEY:-}
      CUBEBOT_RESTORE_SECRET_ACCESS_KEY: ${CUBEBOT_RESTORE_SECRET_ACCESS_KEY:-}
    command:
      - sh
      - -euc
      - |
        umask 077
        if [ ! -s /state/credential.key ]; then
          if [ -n "$$CUBEBOT_RESTORE_KEY" ]; then
            printf %s "$$CUBEBOT_RESTORE_KEY" | base64 -d > /state/credential.key || true
            [ "$$(wc -c < /state/credential.key)" -eq 32 ] || { rm /state/credential.key; echo "CUBEBOT_RESTORE_KEY is not the base64 key cubebot key prints" >&2; exit 1; }
          else
            head -c 32 /dev/urandom > /state/credential.key
          fi
        fi
        printf %s "$$CUBEBOT_BACKUP_SECRET_ACCESS_KEY" > /state/backup-secret
        printf %s "$$CUBEBOT_RESTORE_SECRET_ACCESS_KEY" > /state/restore-secret
        chown 65532:65532 /state/credential.key /state/backup-secret /state/restore-secret
    volumes:
      - orchestrator-state:/state
    network_mode: none

  orchestrator:
    # The `local` default only ever applies under compose.dev.yaml, which replaces the image.
    image: ${CUBEBOT_REGISTRY:-ghcr.io/vicotrbb}/cubebot-orchestrator:${CUBEBOT_VERSION:-local}
    environment:
      CUBEBOT_DATABASE_URL: postgres://cubebot:${POSTGRES_PASSWORD}@postgres:5432/cubebot
      CUBEBOT_BIND_ADDR: 0.0.0.0:8080
      CUBEBOT_CREDENTIAL_KEY_FILE: /state/credential.key
      CUBEBOT_PUBLIC_ORIGIN: http://localhost:${CUBEBOT_PORT:-3000}
      CUBEBOT_STORAGE_DIRECTORY: /var/lib/cubebot/files
      CUBEBOT_INSTALLATION_NAME: ${CUBEBOT_INSTALLATION_NAME:-Cubebot}
      RUST_LOG: ${RUST_LOG:-info}
      # Backups (Platform › Backup shows each value set here as read-only); empty is unset.
      CUBEBOT_BACKUP_ENDPOINT: ${CUBEBOT_BACKUP_ENDPOINT:-}
      CUBEBOT_BACKUP_REGION: ${CUBEBOT_BACKUP_REGION:-}
      CUBEBOT_BACKUP_BUCKET: ${CUBEBOT_BACKUP_BUCKET:-}
      CUBEBOT_BACKUP_ACCESS_KEY_ID: ${CUBEBOT_BACKUP_ACCESS_KEY_ID:-}
      CUBEBOT_BACKUP_SECRET_ACCESS_KEY_FILE: /state/backup-secret
      CUBEBOT_BACKUP_SCHEDULE: ${CUBEBOT_BACKUP_SCHEDULE:-}
      CUBEBOT_BACKUP_KEEP_DAILY: ${CUBEBOT_BACKUP_KEEP_DAILY:-}
      CUBEBOT_BACKUP_KEEP_WEEKLY: ${CUBEBOT_BACKUP_KEEP_WEEKLY:-}
      CUBEBOT_BACKUP_BANDWIDTH_BYTES: ${CUBEBOT_BACKUP_BANDWIDTH_BYTES:-}
      CUBEBOT_BACKUP_CONCURRENCY: ${CUBEBOT_BACKUP_CONCURRENCY:-}
      # A fresh installation restores from here at its first start; ignored once it has data.
      CUBEBOT_RESTORE_ENDPOINT: ${CUBEBOT_RESTORE_ENDPOINT:-}
      CUBEBOT_RESTORE_REGION: ${CUBEBOT_RESTORE_REGION:-}
      CUBEBOT_RESTORE_BUCKET: ${CUBEBOT_RESTORE_BUCKET:-}
      CUBEBOT_RESTORE_ACCESS_KEY_ID: ${CUBEBOT_RESTORE_ACCESS_KEY_ID:-}
      CUBEBOT_RESTORE_SECRET_ACCESS_KEY_FILE: /state/restore-secret
      CUBEBOT_RESTORE_BACKUP: ${CUBEBOT_RESTORE_BACKUP:-}
    volumes:
      - orchestrator-state:/state:ro
      # Shared files: only this one orchestrator mounts it.
      - shared-files:/var/lib/cubebot/files
    depends_on:
      postgres:
        condition: service_healthy
      credential-key:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging
    # Time for its handlers and the controller to stop and for it to release ownership.
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  web:
    image: ${CUBEBOT_REGISTRY:-ghcr.io/vicotrbb}/cubebot-web:${CUBEBOT_VERSION:-local}
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true

  proxy:
    image: caddy:2.10.2-alpine
    ports:
      - '127.0.0.1:${CUBEBOT_PORT:-3000}:3000'
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
    depends_on:
      - orchestrator
      - web
    restart: unless-stopped
    logging: *logging

configs:
  # The console and its API on one origin, as an ingress serves them.
  caddyfile:
    content: |
      ${CUBEBOT_DOMAIN:-http://:3000} {
      	reverse_proxy /api/* orchestrator:8080
      	reverse_proxy web:3000
      }

volumes:
  postgres-data:
  orchestrator-state:
  shared-files:
  caddy-data:
