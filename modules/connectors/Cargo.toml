[package]
name = "cubebot-connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false }
chrono-tz = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hmac = "0.12.1"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
mail-parser = "0.11"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
roxmltree = "0.21.2"
rrule = "0.14"
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
rsa = { version = "0.9.10", features = ["sha2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "mysql", "json", "chrono", "uuid"] }
tokio = { workspace = true, features = ["io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing.workspace = true
utoipa = { version = "5.5", optional = true }
webpki-roots = "1"

[features]
# Schemas for the orchestrator's OpenAPI document.
openapi = ["dep:utoipa"]
