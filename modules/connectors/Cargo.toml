[package]
name = "cubebot-connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22.1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
mail-parser = "0.11"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
roxmltree = "0.21.2"
rsa = { version = "0.9.10", features = ["sha2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
tokio = { workspace = true, features = ["io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing.workspace = true
utoipa = { version = "5.5", optional = true }
webpki-roots = "1"

[features]
# Schemas for the orchestrator's OpenAPI document.
openapi = ["dep:utoipa"]
