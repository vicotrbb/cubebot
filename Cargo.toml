[workspace]
members = [
    "apps/orchestrator",
    "apps/agent",
    "modules/protocol",
    "modules/providers",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
axum = "0.8.9"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
cubebot-protocol = { path = "modules/protocol" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cognitive_complexity = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Debug-built Argon2 makes every test login take seconds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
