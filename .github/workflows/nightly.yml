name: Nightly
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The cluster suites run the kvm runtime: GitHub's x86_64 Ubuntu runners expose /dev/kvm,
  # and kind's privileged node hands it to the device plugin.
  cluster:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      HAS_PROVIDER_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.26'
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.55.1'
      - name: Install Rust toolchain from repository pin
        run: rustup show active-toolchain
      - run: uv sync --project tooling/quality --locked
      - name: Install kernel build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bc bison flex libelf-dev
      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install verified Helm v4.2.2
        run: |
          curl -fsSLo "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v4.2.2-linux-amd64.tar.gz
          echo "9adafecab4d406853bba163a70e9f104f47dbbf65ce24b7653bae7e36150bcb6  $RUNNER_TEMP/helm.tgz" | sha256sum --check
          sudo tar -xzf "$RUNNER_TEMP/helm.tgz" -C /usr/local/bin --strip-components=1 linux-amd64/helm
      - name: Install verified kind v0.33.0
        run: |
          mkdir -p .tools
          curl -fsSLo .tools/kind-v0.33.0 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  .tools/kind-v0.33.0' | sha256sum --check
          chmod +x .tools/kind-v0.33.0
      - run: just cluster-admission
      - run: just cluster-startup
      - name: Write provider key outside the checkout
        if: env.HAS_PROVIDER_KEY == 'true'
        run: (umask 077 && printf '%s' "$OPENAI_API_KEY" > "$RUNNER_TEMP/openai-key")
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: just cluster-chat
        if: env.HAS_PROVIDER_KEY == 'true'
        env:
          CUBEBOT_QUALIFICATION_DIRECTORY: ${{ runner.temp }}/cluster-chat
          OPENAI_API_KEY_FILE: ${{ runner.temp }}/openai-key
      - run: just cluster-sandbox
        if: env.HAS_PROVIDER_KEY == 'true'
        env:
          CUBEBOT_QUALIFICATION_DIRECTORY: ${{ runner.temp }}/cluster-sandbox
          OPENAI_API_KEY_FILE: ${{ runner.temp }}/openai-key

  # The real-model docker-* suites in the container runtime; the homelab host runs them in
  # the kvm runtime.
  docker-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      HAS_PROVIDER_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
      CUBEBOT_SANDBOX_RUNTIME: container
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.26'
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.55.1'
      - name: Install Rust toolchain from repository pin
        run: rustup show active-toolchain
      - name: Install Playwright's Chromium outside the checkout
        if: env.HAS_PROVIDER_KEY == 'true'
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/playwright" playwright@1.55.0
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
          echo "CUBEBOT_PLAYWRIGHT_MODULE=$RUNNER_TEMP/playwright/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Write provider key outside the checkout
        if: env.HAS_PROVIDER_KEY == 'true'
        run: (umask 077 && printf '%s' "$OPENAI_API_KEY" > "$RUNNER_TEMP/openai-key")
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Run the docker-* suites
        if: env.HAS_PROVIDER_KEY == 'true'
        env:
          OPENAI_API_KEY_FILE: ${{ runner.temp }}/openai-key
        run: |
          for suite in sandbox dreams browser desktop login vault rooms files routines skills; do
            just "docker-$suite"
          done
