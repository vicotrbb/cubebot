name: Guest
# Shared by ci.yml (build only) and release.yml (build and push). Callers grant packages: write to push.
on:
  workflow_call:
    inputs:
      tag:
        description: Push ghcr.io/vicotrbb/cubebot-sandbox with this tag; empty builds without pushing.
        type: string
        default: ''

jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.26'
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.55.1'
      - name: Install Rust toolchain from repository pin
        run: rustup show active-toolchain
      - name: Install kernel build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bc bison flex libelf-dev
      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: just guest-boot
      - name: Log in to GHCR
        if: inputs.tag != ''
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build the sandbox image with the guest
        run: docker build --build-context guest=target/guest -f apps/sandbox/Dockerfile ${TAG:+--push -t "ghcr.io/vicotrbb/cubebot-sandbox:$TAG"} .
        env:
          TAG: ${{ inputs.tag }}
