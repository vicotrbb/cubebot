# Agents without CUBEBOT_DOMAIN: HTTPS on the Docker bridge (macOS: loopback) with a development CA.
services:
  proxy:
    environment:
      # Its fingerprint, so a reissued certificate recreates this container, which reads it once.
      CUBEBOT_CONTROL_CERT: ${CUBEBOT_CONTROL_CERT:?set by deploy/cubebot}
    ports:
      - '${CUBEBOT_CONTROL_ADDRESS:?set by deploy/cubebot}:8443:8443'
    volumes:
      - ${CUBEBOT_DEV_CA:?set by deploy/cubebot}:/run/dev-ca:ro
    configs:
      - source: control
        target: /etc/caddy/control
    command: [caddy, run, --config, /etc/caddy/control, --adapter, caddyfile]

configs:
  control:
    content: |
      import /etc/caddy/Caddyfile
      https://:8443 {
      	tls /run/dev-ca/server.crt /run/dev-ca/server.key
      	reverse_proxy orchestrator:8080
      }
