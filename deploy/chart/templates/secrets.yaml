{{- if not .Values.credentials.existingSecret }}
{{- $credentials := lookup "v1" "Secret" .Release.Namespace "credentials" }}
# Encrypts stored provider and vault credentials; losing it loses them, so it outlives uninstall.
apiVersion: v1
kind: Secret
metadata:
  name: credentials
  labels: {{- include "cubebot.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  key: {{ dig "data" "key" (randBytes 32) $credentials }}
{{- end }}
{{- if not (or .Values.externalDatabase.existingSecret .Values.postgres.existingSecret) }}
{{- $database := lookup "v1" "Secret" .Release.Namespace "database" }}
{{- $password := dig "data" "password" "" $database | b64dec | default (randAlphaNum 32) }}
---
# Kept with the database volume, which an initialized PostgreSQL ties to this password.
apiVersion: v1
kind: Secret
metadata:
  name: database
  labels: {{- include "cubebot.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $password | quote }}
  database_url: {{ printf "postgres://cubebot:%s@postgres:5432/cubebot" $password | quote }}
{{- end }}
{{- if and .Values.admin.password (not .Values.admin.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: admin
  labels: {{- include "cubebot.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.admin.password | quote }}
{{- end }}
{{- if not .Values.control.existingSecret }}
{{- $control := lookup "v1" "Secret" .Release.Namespace "control-tls" }}
---
# The sandboxes' certificate authority and the orchestrator's control certificate. Agents trust
# only this authority, so it outlives uninstall like the volumes they keep.
apiVersion: v1
kind: Secret
metadata:
  name: control-tls
  labels: {{- include "cubebot.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
{{- if $control }}
  tls.crt: {{ index $control.data "tls.crt" }}
  tls.key: {{ index $control.data "tls.key" }}
  ca.crt: {{ index $control.data "ca.crt" }}
{{- else }}
{{- $ca := genCA "Cubebot control" 3650 }}
{{- $names := list "orchestrator-control" (printf "orchestrator-control.%s" .Release.Namespace) (printf "orchestrator-control.%s.svc" .Release.Namespace) (include "cubebot.controlHost" .) }}
{{- $cert := genSignedCert "orchestrator-control" nil $names 3650 $ca }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  ca.crt: {{ $ca.Cert | b64enc }}
{{- end }}
{{- end }}
