{{- if not .Values.credentials.existingSecret }}
{{- $credentials := lookup "v1" "Secret" .Release.Namespace "credentials" }}
# Encrypts stored provider and vault credentials; losing it loses them, so it outlives uninstall.
apiVersion: v1
kind: Secret
metadata:
  name: credentials
  labels: {{- include "cubebot.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  key: {{ dig "data" "key" (randBytes 32) $credentials }}
{{- end }}
{{- if not (or .Values.externalDatabase.existingSecret .Values.postgres.existingSecret) }}
{{- $database := lookup "v1" "Secret" .Release.Namespace "database" }}
{{- $password := dig "data" "password" "" $database | b64dec | default (randAlphaNum 32) }}
---
# Kept with the database volume, which an initialized PostgreSQL ties to this password.
apiVersion: v1
kind: Secret
metadata:
  name: database
  labels: {{- include "cubebot.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $password | quote }}
  database_url: {{ printf "postgres://cubebot:%s@postgres:5432/cubebot" $password | quote }}
{{- end }}
