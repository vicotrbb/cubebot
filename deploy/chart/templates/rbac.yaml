apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  labels: {{- include "cubebot.labels" . | nindent 4 }}
---
# Agent pods run as this account with only their projected identity token (docs/adr/packaging.md#one-namespace-for-the-entire-installation).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cubebot-runtime
  labels: {{- include "cubebot.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orchestrator
  labels: {{- include "cubebot.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims, configmaps]
    verbs: [get, create, patch, delete]
  # The desktop host channel runs a command in the sandbox container.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator
  labels: {{- include "cubebot.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orchestrator
---
# Verifies the projected tokens agents bootstrap with.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cubebot-{{ .Release.Namespace }}-tokenreview
  labels: {{- include "cubebot.labels" . | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cubebot-{{ .Release.Namespace }}-tokenreview
  labels: {{- include "cubebot.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cubebot-{{ .Release.Namespace }}-tokenreview
