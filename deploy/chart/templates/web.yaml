apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {{- include "cubebot.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        {{- include "cubebot.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: {{ include "cubebot.image" (list $ "web") }}
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: {{- include "cubebot.labels" . | nindent 4 }}
spec:
  selector:
    app: web
  ports:
    - port: 3000
