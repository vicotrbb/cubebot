{{- $policy := .Values.sandbox.networkPolicy }}
{{- $controller := $policy.ingressController }}
# Sandboxes accept nothing and reach only DNS, the orchestrator's control port, the outside and
# the private destinations an administrator granted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandboxes
  labels: {{- include "cubebot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: cubebot.dev/agent
        operator: Exists
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        # The sandboxes' own nameservers, such as a NodeLocal DNSCache on a host address.
        {{- range $.Values.sandbox.dns }}
        - ipBlock:
            cidr: {{ . }}/{{ ternary 128 32 (contains ":" .) }}
        {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: orchestrator
      ports:
        - protocol: TCP
          port: 8443
    {{- if $controller.podSelector }}
    - to:
        - namespaceSelector: {{- toYaml $controller.namespaceSelector | nindent 12 }}
          podSelector: {{- toYaml $controller.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ $controller.port }}
    {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{- toYaml $policy.blockedRanges | nindent 14 }}
    {{- range $policy.privateDestinations }}
    - to:
        - ipBlock:
            cidr: {{ required "each private destination needs a cidr" .cidr }}
      {{- with .ports }}
      ports:
        {{- range . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      {{- end }}
    {{- end }}
---
# The console API stays open to the ingress controller, wherever it runs; the control port takes
# only sandboxes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orchestrator
  labels: {{- include "cubebot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: orchestrator
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchExpressions:
              - key: cubebot.dev/agent
                operator: Exists
      ports:
        - protocol: TCP
          port: 8443
{{- if not .Values.externalDatabase.existingSecret }}
---
# Only the orchestrator talks to the bundled database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  labels: {{- include "cubebot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: orchestrator
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
