{{- with .Values.meetings.publicHttpRoute }}
{{- if .enabled }}
{{- $host := (urlParse (required "meetings.publicOrigin is required for meetings.publicHttpRoute" $.Values.meetings.publicOrigin)).host }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cubebot-meetings
  labels: {{- include "cubebot.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs: {{- required "meetings.publicHttpRoute.parentRefs is required" .parentRefs | toYaml | nindent 4 }}
  hostnames: [{{ $host | quote }}]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/public/meetings
      backendRefs:
        - name: orchestrator
          port: 8080
      timeouts:
        request: 0s
    - matches:
        {{- range list "/m" "/assets" "/fonts" "/icons" }}
        - path:
            type: PathPrefix
            value: {{ . }}
        {{- end }}
        {{- range list "/call-capture.js" "/favicon.svg" "/manifest.webmanifest" "/apple-touch-icon.png" }}
        - path:
            type: Exact
            value: {{ . }}
        {{- end }}
      backendRefs:
        - name: web
          port: 3000
{{- end }}
{{- end }}
