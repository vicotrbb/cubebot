{{- if not .Values.externalDatabase.existingSecret }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "cubebot.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        {{- include "cubebot.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ include "cubebot.image" (list $ "postgres") }}
          env:
            - name: POSTGRES_USER
              value: cubebot
            - name: POSTGRES_DB
              value: cubebot
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cubebot.databaseSecret" . }}
                  key: password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, cubebot]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOncePod]
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "cubebot.labels" . | nindent 4 }}
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
{{- end }}
