# Shared files; kept on uninstall like the database volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-files
  labels: {{- include "cubebot.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOncePod]
  {{- with .Values.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
# One active orchestrator: never two pods, even during a rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  labels: {{- include "cubebot.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
        {{- include "cubebot.labels" . | nindent 8 }}
      annotations:
        # It reads its controller configuration once, at start.
        checksum/controller: {{ include (print $.Template.BasePath "/controller.yaml") . | sha256sum }}
    spec:
      serviceAccountName: orchestrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The key leaves the Secret volume for a tmpfs only this user can read.
        - name: private-key
          image: {{ include "cubebot.image" (list $ "orchestrator") }}
          command: [/bin/sh, -c, umask 077; cp /source/key /private/key]
          securityContext: {{- include "cubebot.restricted" . | nindent 12 }}
          volumeMounts:
            - name: source-key
              mountPath: /source
              readOnly: true
            - name: credentials
              mountPath: /private
      containers:
        - name: orchestrator
          image: {{ include "cubebot.image" (list $ "orchestrator") }}
          securityContext: {{- include "cubebot.restricted" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            - name: control
              containerPort: 8443
          env:
            - name: CUBEBOT_BIND_ADDR
              value: 0.0.0.0:8080
            - name: CUBEBOT_CONTROL_BIND_ADDR
              value: 0.0.0.0:8443
            - name: CUBEBOT_CONTROL_TLS_CERT_FILE
              value: /etc/cubebot/control/tls.crt
            - name: CUBEBOT_CONTROL_TLS_KEY_FILE
              value: /etc/cubebot/control/tls.key
            - name: CUBEBOT_PUBLIC_ORIGIN
              value: {{ required "publicOrigin is required" .Values.publicOrigin | quote }}
            - name: CUBEBOT_CONTROLLER_CONFIG
              value: /etc/controller/config.json
            - name: CUBEBOT_CREDENTIAL_KEY_FILE
              value: /etc/credentials/key
            - name: CUBEBOT_STORAGE_DIRECTORY
              value: /var/lib/cubebot/files
            {{- with .Values.storage.quotaBytes }}
            - name: CUBEBOT_STORAGE_QUOTA_BYTES
              value: {{ . | int64 | quote }}
            {{- end }}
            {{- with .Values.uploads.maxBytes }}
            - name: CUBEBOT_UPLOAD_LIMIT_BYTES
              value: {{ . | int64 | quote }}
            {{- end }}
            {{- with .Values.installationName }}
            - name: CUBEBOT_INSTALLATION_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- if or .Values.admin.password .Values.admin.existingSecret }}
            - name: CUBEBOT_BOOTSTRAP_LOGIN
              value: {{ required "admin.login is required with an admin password" .Values.admin.login | quote }}
            - name: CUBEBOT_BOOTSTRAP_PASSWORD_FILE
              value: /etc/cubebot/admin/password
            {{- end }}
            {{- range $name, $value := dict "ENDPOINT" .Values.backup.endpoint "REGION" .Values.backup.region "BUCKET" .Values.backup.bucket "SCHEDULE" .Values.backup.schedule }}
            {{- if $value }}
            - name: CUBEBOT_BACKUP_{{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- range $name, $value := dict "KEEP_DAILY" .Values.backup.keepDaily "KEEP_WEEKLY" .Values.backup.keepWeekly "BANDWIDTH_BYTES" .Values.backup.bandwidthBytes "CONCURRENCY" .Values.backup.concurrency }}
            {{- if or $value (eq (toString $value) "0") }}
            - name: CUBEBOT_BACKUP_{{ $name }}
              value: {{ $value | int64 | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.backup.existingSecret }}
            - name: CUBEBOT_BACKUP_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: access-key-id
            - name: CUBEBOT_BACKUP_SECRET_ACCESS_KEY_FILE
              value: /etc/cubebot/backup/secret-access-key
            {{- end }}
            {{- if .Values.restore.enabled }}
            {{- if not .Values.credentials.existingSecret }}
            {{- fail "restore.enabled needs credentials.existingSecret: a Secret holding the backed-up installation's credential key" }}
            {{- end }}
            - name: CUBEBOT_RESTORE_BUCKET
              value: {{ required "restore.bucket is required" .Values.restore.bucket | quote }}
            {{- range $name, $value := dict "ENDPOINT" .Values.restore.endpoint "REGION" .Values.restore.region "BACKUP" .Values.restore.backup }}
            {{- if $value }}
            - name: CUBEBOT_RESTORE_{{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            - name: CUBEBOT_RESTORE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "restore.existingSecret is required" .Values.restore.existingSecret }}
                  key: access-key-id
            - name: CUBEBOT_RESTORE_SECRET_ACCESS_KEY_FILE
              value: /etc/cubebot/restore/secret-access-key
            {{- end }}
            # The read-only root keeps no home; libraries that cache write here.
            - name: HOME
              value: /tmp
            - name: CUBEBOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "cubebot.databaseSecret" . }}
                  key: database_url
            - name: CUBEBOT_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CUBEBOT_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CUBEBOT_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          # Migrations and proof that the previous orchestrator stopped run before it serves.
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # The database answers; a database outage takes it out of the Service, never restarts it.
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources: {{- toYaml .Values.orchestrator.resources | nindent 12 }}
          volumeMounts:
            - name: controller
              mountPath: /etc/controller
              readOnly: true
            - name: credentials
              mountPath: /etc/credentials
              readOnly: true
            - name: control
              mountPath: /etc/cubebot/control
              readOnly: true
            {{- if or .Values.admin.password .Values.admin.existingSecret }}
            - name: admin
              mountPath: /etc/cubebot/admin
              readOnly: true
            {{- end }}
            - name: shared-files
              mountPath: /var/lib/cubebot/files
            {{- if .Values.backup.existingSecret }}
            - name: backup-bucket
              mountPath: /etc/cubebot/backup
              readOnly: true
            {{- end }}
            {{- if .Values.restore.enabled }}
            - name: restore-bucket
              mountPath: /etc/cubebot/restore
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: controller
          configMap:
            name: controller
        - name: credentials
          emptyDir:
            medium: Memory
        - name: source-key
          secret:
            secretName: {{ include "cubebot.credentialsSecret" . }}
            defaultMode: 0440
        - name: control
          secret:
            secretName: {{ include "cubebot.controlSecret" . }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- if or .Values.admin.password .Values.admin.existingSecret }}
        - name: admin
          secret:
            secretName: {{ include "cubebot.adminSecret" . }}
            defaultMode: 0440
            items:
              - key: password
                path: password
        {{- end }}
        - name: shared-files
          persistentVolumeClaim:
            claimName: shared-files
        {{- with .Values.backup.existingSecret }}
        - name: backup-bucket
          secret:
            secretName: {{ . }}
            defaultMode: 0440
            items:
              - key: secret-access-key
                path: secret-access-key
        {{- end }}
        {{- if .Values.restore.enabled }}
        - name: restore-bucket
          secret:
            secretName: {{ .Values.restore.existingSecret }}
            defaultMode: 0440
            items:
              - key: secret-access-key
                path: secret-access-key
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  labels: {{- include "cubebot.labels" . | nindent 4 }}
spec:
  selector:
    app: orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Sandboxes reach the orchestrator here, over TLS from the control certificate authority.
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-control
  labels: {{- include "cubebot.labels" . | nindent 4 }}
spec:
  selector:
    app: orchestrator
  ports:
    - name: control
      port: 8443
      targetPort: control
