# The guest desktop (ADR 0085): the virtio-gpu display and the sandbox's virtio keyboard and
# tablet, the only input devices, which the kernel numbers in the sandbox's device order. The
# guest runs no udev, so devices are named here rather than hotplugged.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
EndSection

Section "Device"
    Identifier "gpu"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    # No GPU on the host: the 2D device takes damage transfers of a shadow framebuffer.
    Option "AccelMethod" "none"
EndSection

Section "Screen"
    Identifier "screen"
    Device "gpu"
EndSection

Section "InputDevice"
    Identifier "keyboard"
    Driver "evdev"
    Option "Device" "/dev/input/event0"
EndSection

Section "InputDevice"
    Identifier "tablet"
    Driver "evdev"
    Option "Device" "/dev/input/event1"
EndSection

Section "ServerLayout"
    Identifier "desktop"
    Screen "screen"
    InputDevice "keyboard" "CoreKeyboard"
    InputDevice "tablet" "CorePointer"
EndSection
