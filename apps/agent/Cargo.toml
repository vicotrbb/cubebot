[package]
name = "cubebot-agent"
default-run = "cubebot-agent"
autobins = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cubebot-agent"
path = "src/main.rs"
test = false

[dependencies]
cubebot-providers = { path = "../../modules/providers" }
sha2 = "0.10"
cubebot-protocol.workspace = true
serde.workspace = true
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true, features = ["process", "io-util"] }
nix = { version = "0.31", features = ["fs", "mount", "net", "process", "reboot", "signal", "socket"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "alloc"] }

[dev-dependencies]
axum = { workspace = true, features = ["ws"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
