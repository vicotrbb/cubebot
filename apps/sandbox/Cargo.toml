[package]
name = "cubebot-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cubebot-sandbox"
path = "src/main.rs"

[dependencies]
cubebot-protocol.workspace = true
nix = { version = "0.31", features = ["ioctl", "mman", "net", "process", "signal"] }
serde_json = "1"
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = "1"

# The workspace lints, except that unsafe code is denied rather than forbidden so the kvm module
# alone can allow it (ADR 0084).
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
cognitive_complexity = "deny"
