[package]
name = "cubebot-orchestrator"
default-run = "cubebot-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

# Bins carry no unit tests; skipping their harnesses avoids empty test binaries.
[[bin]]
name = "cubebot-orchestrator"
path = "src/main.rs"
test = false

[[bin]]
name = "cubebot-admin"
path = "src/bin/cubebot-admin.rs"
test = false

[[test]]
name = "orchestrator"
path = "tests/main.rs"

[dependencies]
argon2 = "0.5"
axum = { workspace = true, features = ["ws"] }
cubebot-protocol = { workspace = true, features = ["openapi"] }
cubebot-connectors = { workspace = true, features = ["openapi"] }
cubebot-providers = { path = "../../modules/providers" }
chrono = { version = "0.4", default-features = false }
chrono-tz.workspace = true
futures-util = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { workspace = true, features = ["derive"] }
sha2 = "0.10"
# A viewer matches its answer by the exact `t` it sent, so floats must round-trip.
serde_json = { version = "1", features = ["float_roundtrip"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "uuid", "json"] }
tokio = { workspace = true, features = ["process", "io-util", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
# statvfs, to keep the storage quota within the volume's real size.
nix = { version = "0.31", default-features = false, features = ["fs"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "ring", "ws"] }
k8s-openapi = { version = "0.28.0", features = ["v1_36"] }
aes-gcm = "0.10"
bzip2 = "0.4"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream", "json"] }
# 2.0 ships without the espeak-ng frontend and cannot run Piper.
sherpa-onnx = "=1.13.8"
tar = "0.4"
utoipa = { version = "5.5", features = ["uuid"] }

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["process", "io-util"] }

[lints]
workspace = true
